name: Watch official upstream

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare maintained main with official upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git remote add official https://github.com/browser-use/browser-harness.git
          git fetch official main --quiet
          count=$(git rev-list --count HEAD..official/main)
          latest=$(git rev-parse official/main)
          current=$(git rev-parse HEAD)
          if [ "$count" -eq 0 ]; then
            echo "Maintained main already contains official upstream main."
            exit 0
          fi
          existing=$(gh issue list --repo "$REPO" --state open --label upstream-sync --json number --jq '.[0].number // empty')
          body=$(printf 'Official upstream is ahead by **%s commit(s)**.\n\n- Maintained main: `%s`\n- Official main: `%s`\n\nFollow `docs/maintained-fork.md`: snapshot, review, sync branch, tests, PR, maintainer review. This watcher does not merge automatically.' "$count" "$current" "$latest")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "Upstream review required: $count new commit(s)" --label upstream-sync,needs-triage --body "$body"
          fi
