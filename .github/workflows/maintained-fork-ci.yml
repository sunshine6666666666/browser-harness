name: Maintained fork CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: uv run --with pytest pytest -q
      - name: Compile maintained domain adapters
        run: uv run python -m compileall -q agent-workspace/domain-skills scripts
      - name: Validate domain-skill registry JSON
        run: uv run python -m json.tool agent-workspace/domain-skills/registry.json >/dev/null
